services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ryokan}
      POSTGRES_USER: ${POSTGRES_USER:-ryokan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ryokan_local_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./ryokan-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ryokan}
      DB_USERNAME: ${POSTGRES_USER:-ryokan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ryokan_local_password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend-customer:
    build:
      context: ./ryokan-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_PORTAL: customer
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_PORTAL: customer
    ports:
      - "${CUSTOMER_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./ryokan-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_PORTAL: admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_PORTAL: admin
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
