spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ryokan}
spring.datasource.username=${DB_USERNAME:ryokan}
spring.datasource.password=${DB_PASSWORD:ryokan_local_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
