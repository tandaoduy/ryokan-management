services:
  frontend-customer:
    build:
      target: build
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_PORTAL: customer
      WATCHPACK_POLLING: "true"
    volumes:
      - ./ryokan-frontend:/app
      - frontend_customer_node_modules:/app/node_modules
      - frontend_customer_next:/app/.next

  frontend-admin:
    build:
      target: build
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_PORTAL: admin
      WATCHPACK_POLLING: "true"
    volumes:
      - ./ryokan-frontend:/app
      - frontend_admin_node_modules:/app/node_modules
      - frontend_admin_next:/app/.next

volumes:
  frontend_customer_node_modules:
  frontend_admin_node_modules:
  frontend_customer_next:
  frontend_admin_next:
